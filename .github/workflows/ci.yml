name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lingua
          POSTGRES_PASSWORD: lingua
          POSTGRES_DB: lingua_coach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lingua -d lingua_coach"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
          working-directory: apps/backend

      - name: Install and test
        run: |
          uv sync --extra dev
          uv run pytest

  evals-replay:
    name: evals-replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true
          working-directory: apps/backend

      # Replay from repo root with the backend venv interpreter.
      # `uv run --directory apps/backend python -m evals.run` would leave cwd
      # as apps/backend, so the repo-root `evals` package would not import.
      # Exact command after sync:
      #   PYTHONPATH="${GITHUB_WORKSPACE}/apps/backend:${GITHUB_WORKSPACE}"
      #   apps/backend/.venv/bin/python -m evals.run --suite regression --replay
      # No GEMINI_API_KEY: CI uses committed replay fixtures only.
      - name: Replay regression suite
        run: |
          cd apps/backend && uv sync --extra dev
          cd "${GITHUB_WORKSPACE}"
          export PYTHONPATH="${GITHUB_WORKSPACE}/apps/backend:${GITHUB_WORKSPACE}"
          apps/backend/.venv/bin/python -m evals.run --suite regression --replay

      - name: Upload eval results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: evals-results
          path: evals/results/
          if-no-files-found: ignore

  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install, lint, typecheck, test
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
