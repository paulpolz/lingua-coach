# Local dev stack. Requires env files before first run:
#   cp apps/backend/.env.example apps/backend/.env
#   cp apps/frontend/.env.example apps/frontend/.env.local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lingua
      POSTGRES_PASSWORD: lingua
      POSTGRES_DB: lingua_coach
    ports:
      - "5432:5432"
    volumes:
      - lingua_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingua -d lingua_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://lingua:lingua@postgres:5432/lingua_coach
      SKILLS_DIR: /skills
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./apps/backend:/app
      - backend_venv:/app/.venv
      - ./skills:/skills:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Local dev only: apply pending migrations before serving (prod runs Alembic explicitly).
    command: >
      sh -c "uv run alembic upgrade head &&
             exec uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    env_file:
      - ./apps/frontend/.env.local
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  lingua_pg_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:
