# Local dev stack. Requires env files before first run:
#   cp apps/backend/.env.example apps/backend/.env
#   cp apps/frontend/.env.example apps/frontend/.env.local
#
# App only:
#   docker compose up
# App + monitoring (Prometheus / Loki / Grafana):
#   docker compose --profile monitoring up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lingua
      POSTGRES_PASSWORD: lingua
      POSTGRES_DB: lingua_coach
    ports:
      - "5432:5432"
    volumes:
      - lingua_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lingua -d lingua_coach"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
    ports:
      - "8000:8000"
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://lingua:lingua@postgres:5432/lingua_coach
      SKILLS_DIR: /skills
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./apps/backend:/app
      - backend_venv:/app/.venv
      - ./skills:/skills:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Local dev only: apply pending migrations before serving (prod runs Alembic explicitly).
    command: >
      sh -c "uv run alembic upgrade head &&
             exec uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    env_file:
      - ./apps/frontend/.env.local
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      - backend

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v2.55.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - backend

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    volumes:
      - ./infra/monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    profiles: [monitoring]
    image: grafana/promtail:3.0.0
    volumes:
      - ./infra/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:11.0.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  lingua_pg_data:
  backend_venv:
  frontend_node_modules:
  frontend_next:
  prometheus_data:
  loki_data:
  grafana_data:
